[project]
name = "sputnik-sr"
version = "0.1.0"
description = "Sputnikmusic scraping utilities and recommender system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ignacio Linari" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"scraper/http.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
